name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace.json is valid JSON
        run: python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
      - name: Validate plugin.json is valid JSON
        run: python3 -c "import json; json.load(open('plugins/netsujo-aio/plugin.json'))"
      - name: Validate SKILL.md frontmatter
        run: |
          for f in plugins/netsujo-aio/skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || (echo "Missing frontmatter in $f"; exit 1)
            head -10 "$f" | grep -q '^name: ' || (echo "Missing name field in $f"; exit 1)
            head -10 "$f" | grep -q '^description: ' || (echo "Missing description field in $f"; exit 1)
          done
          echo "All SKILL.md files have valid frontmatter"
      - name: Validate versioned data contracts
        run: python3 scripts/validate-contracts.py
      - name: Test strict contract behavior
        run: python3 scripts/test-contracts.py
      - name: Run visibility policy regressions
        run: python3 scripts/run-evals.py

  arc-shadow-trial:
    name: ARC shadow trial (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install pinned checker without lifecycle scripts
        run: npm --prefix experiments/arc-shadow ci --ignore-scripts --include=dev --no-audit --no-fund
      - name: Test shadow runner
        run: npm --prefix experiments/arc-shadow test
      - name: Record raw valid, negative and restored results
        env:
          ARC_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm --prefix experiments/arc-shadow run check
      - name: Preserve trial evidence if produced
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arc-shadow-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/arc-shadow/result.json
          if-no-files-found: warn
          retention-days: 7
